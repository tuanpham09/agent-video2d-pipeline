<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" data-light="day" data-mood="normal" role="img" aria-label="Gian thờ đêm (gian_tho_dem)"><title>Gian thờ đêm (gian_tho_dem)</title><style>
.tint{fill:var(--t,#000);opacity:var(--a,0);mix-blend-mode:multiply}
.glow,.moon,.lamp{display:none}
svg[data-light='day']{--a:0}
svg[data-light='dusk']{--t:#ff9a55;--a:.38}
svg[data-light='night']{--t:#1a2650;--a:.74}
svg[data-light='night'] .moon,svg[data-light='dark'] .moon{display:inline}
svg[data-light='dark']{--t:#080a12;--a:.8}
svg[data-light='candle_warm']{--t:#2a160c;--a:.58}
svg[data-light='candle_warm'] .glow,svg[data-light='dusk'] .lamp,svg[data-light='night'] .lamp{display:inline}
svg[data-light='red_flash']{--t:#ff2a1a;--a:.58}
/* chiều sâu: xa nhạt/mờ sương, gần chìm vào bóng tối */
svg[data-light='night'] .layer.near,svg[data-light='candle_warm'] .layer.near{filter:brightness(.72)}
svg[data-light='night'] .layer.far{filter:brightness(1.12) saturate(.75)}
svg[data-light='dark'] .layer.near{filter:brightness(.5)}
svg[data-light='dark'] .layer.far{filter:brightness(1.2) saturate(.6)}
/* vùng sáng: tối dần ra xa nguồn sáng */
.pool,.pool2,.mist,.grain,.vig2,.creep{display:none}
svg[data-light='candle_warm'] .pool{display:inline}
svg[data-light='night'] .pool2,svg[data-light='dark'] .pool2,svg[data-light='dusk'] .pool2{display:inline}
/* mood rợn */
svg[data-mood='creepy'] .creep,svg[data-mood='creepy'] .mist,svg[data-mood='creepy'] .vig2{display:inline}
svg[data-mood='creepy'] .grain{display:inline;opacity:.16;mix-blend-mode:overlay}
svg[data-mood='creepy'][data-light='day']{--t:#8d9a94;--a:.34}
svg[data-mood='creepy'][data-light='dusk']{--t:#c9764a;--a:.5}
svg[data-mood='creepy'][data-light='night']{--t:#141f3a;--a:.8}
</style><defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb7c4"/><stop offset="1" stop-color="#e8dcc4"/></linearGradient><linearGradient id="fogg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#d9e0dc"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient><radialGradient id="glowg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset=".45" stop-color="#ff9a3a" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient><radialGradient id="poolg" gradientUnits="userSpaceOnUse" cx="960" cy="560" r="880"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></radialGradient><radialGradient id="poolg2" gradientUnits="userSpaceOnUse" cx="960" cy="560" r="900"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".25" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient><radialGradient id="vig2g" cx=".5" cy=".5" r=".7"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient><filter id="grainf" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter></defs><g class="layer far"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#a89a7b" stroke="none" stroke-width="0" /><rect x="0" y="820" width="1920" height="260" rx="0" fill="#7b5c3c" stroke="none" stroke-width="0" /><line x1="120" y1="0" x2="120" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="280" y1="0" x2="280" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="440" y1="0" x2="440" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="600" y1="0" x2="600" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="760" y1="0" x2="760" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="920" y1="0" x2="920" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="1080" y1="0" x2="1080" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="1240" y1="0" x2="1240" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="1400" y1="0" x2="1400" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="1560" y1="0" x2="1560" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="1720" y1="0" x2="1720" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><line x1="1880" y1="0" x2="1880" y2="820" stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" /><rect x="120" y="0" width="70" height="820" rx="0" fill="#4a3220" stroke="#1a120c" stroke-width="5" /><rect x="1730" y="0" width="70" height="820" rx="0" fill="#4a3220" stroke="#1a120c" stroke-width="5" /></g><g class="layer mid"><rect x="560" y="540" width="800" height="300" rx="0" fill="#6a4a2f" stroke="#1a120c" stroke-width="6" /><rect x="600" y="500" width="720" height="40" rx="0" fill="#4a3220" stroke="#1a120c" stroke-width="5" /><rect x="760" y="300" width="400" height="200" rx="0" fill="#4a3220" stroke="#1a120c" stroke-width="6" /><rect x="790" y="330" width="340" height="140" rx="0" fill="#c9a24a" stroke="#1a120c" stroke-width="4" /><path d="M 540 300 L 960 220 L 1380 300 L 1380 330 L 540 330 Z" fill="#5a3a2a" stroke="#1a120c" stroke-width="5" stroke-linejoin="round" /><rect x="690" y="440" width="20" height="60" rx="0" fill="#a23a2a" stroke="#1a120c" stroke