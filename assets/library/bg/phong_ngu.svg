<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" data-light="day" role="img" aria-label="Phòng ngủ (phong_ngu)"><title>Phòng ngủ (phong_ngu)</title><style>
.tint{fill:var(--t,#000);opacity:var(--a,0);mix-blend-mode:multiply}
.glow,.moon,.lamp{display:none}
