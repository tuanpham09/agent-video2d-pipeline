<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" data-lib-id="house_altar_room" data-lib-kind="location" role="img" aria-label="Gian thờ nhà quê ban đêm">
<title>house_altar_room — gian thờ nhà quê (vách gỗ, cửa sổ nhìn ra vườn chuối, nền gạch)</title>
<defs>
  <linearGradient id="har-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pal-sky_night)"/><stop offset="1" stop-color="var(--pal-sky_night_low)"/></linearGradient>
  <radialGradient id="har-vig" cx="50%" cy="48%" r="75%"><stop offset=".55" stop-color="var(--pal-vignette)" stop-opacity="0"/><stop offset="1" stop-color="var(--pal-vignette)" stop-opacity=".72"/></radialGradient>
  <clipPath id="har-floor"><rect x="0" y="800" width="1920" height="280"/></clipPath>
  <path id="har-leaf" d="M0 0 Q70 -46 190 -8 Q100 14 0 0 Z"/>
</defs>
<style>
.loc-house_altar_room .lw{opacity:0}
.loc-house_altar_room[data-light='warm'] .lw-warm{opacity:.20}
.loc-house_altar_room[data-light='dark'] .lw-dark{opacity:.62}
.loc-house_altar_room[data-light='red_flash'] .lw-red{opacity:.36}
.loc-house_altar_room[data-light='dawn'] .lw-dawn{opacity:.26}
.loc-house_altar_room[data-light='warm'] .win-glow{opacity:.15}
.loc-house_altar_room[data-light='dawn'] .win-dawn{opacity:1}
.loc-house_altar_room .win-dawn{opacity:0}
</style>
<g class="loc loc-house_altar_room" data-light="warm">
  <g class="layer layer-far">
    <rect width="1920" height="800" fill="var(--pal-wall_wood)"/>
    <g stroke="var(--pal-wall_wood_dark)" stroke-width="6">
      <line x1="120" y1="0" x2="120" y2="800"/><line x1="240" y1="0" x2="240" y2="800"/><line x1="360" y1="0" x2="360" y2="800"/><line x1="480" y1="0" x2="480" y2="800"/>
      <line x1="600" y1="0" x2="600" y2="800"/><line x1="720" y1="0" x2="720" y2="800"/><line x1="840" y1="0" x2="840" y2="800"/><line x1="960" y1="0" x2="960" y2="800"/>
      <line x1="1080" y1="0" x2="1080" y2="800"/><line x1="1200" y1="0" x2="1200" y2="800"/><line x1="1320" y1="0" x2="1320" y2="800"/><line x1="1440" y1="0" x2="1440" y2="800"/>
      <line x1="1560" y1="0" x2="1560" y2="800"/><line x1="1680" y1="0" x2="1680" y2="800"/><line x1="1800" y1="0" x2="1800" y2="800"/>
    </g>
    <g stroke="var(--pal-wall_wood_dark)" stroke-width="3" opacity=".6"><path d="M60 140 L100 150 M300 420 L340 410 M780 220 L820 232 M1010 600 L1050 590 M1620 300 L1660 312 M420 690 L470 700"/></g>
    <!-- cửa sổ nhìn ra vườn chuối -->
    <rect x="1190" y="200" width="330" height="380" fill="var(--pal-window_night)" stroke="var(--pal-ink)" stroke-width="10"/>
    <rect x="1200" y="210" width="310" height="360" fill="url(#har-sky)"/>
    <rect class="win-dawn" x="1200" y="210" width="310" height="360" fill="var(--pal-sky_dawn_low)" opacity="0"/>
    <circle cx="1420" cy="290" r="34" fill="var(--pal-moon)"/>
    <g fill="var(--pal-leaf_dark)">
      <use href="#har-leaf" transform="translate(1230 560) rotate(-80) scale(1.5)"/><use href="#har-leaf" transform="translate(1230 560) rotate(-45) scale(1.7)"/><use href="#har-leaf" transform="translate(1230 560) rotate(-12) scale(1.3)"/>
      <use href="#har-leaf" transform="translate(1470 560) rotate(-170) scale(1.5)"/><use href="#har-leaf" transform="translate(1470 560) rotate(-130) scale(1.8)"/><rect x="1224" y="470" width="14" height="100"/><rect x="1464" y="470" width="14" height="100"/>
    </g>
    <path d="M1200 440 Q1355 400 1510 440 L1510 570 L1200 570 Z" fill="var(--pal-mist)" opacity=".18"/>
    <line x1="1355" y1="200" x2="1355" y2="580" stroke="var(--pal-ink)" stroke-width="8"/><line x1="1190" y1="390" x2="1520" y2="390" stroke="var(--pal-ink)" stroke-width="8"/>
    <rect class="win-glow" x="1200" y="210" width="310" height="360" fill="var(--pal-light_cold)" opacity="0"/>
    <rect x="1170" y="580" width="370" height="22" fill="var(--pal-wood_dark)" stroke="var(--pal-ink)" stroke-width="6"/>
    <!-- cửa trái dẫn ra nhà ngoài -->
    <rect x="70" y="170" width="250" height="630" fill="var(--pal-wood_black)" stroke="var(--pal-ink)" stroke-width="10"/>
    <rect x="86" y="186" width="218" height="614" fill="var(--pal-shadow)" opacity=".85"/>
    <!-- sàn gạch -->
    <rect y="800" width="1920" height="280" fill="var(--pal-floor)"/>
    <g clip-path="url(#har-floor)" stroke="var(--pal-floor_dark)" stroke-width="4">
      <line x1="960" y1="560" x2="-500" y2="1080"/><line x1="960" y1="560" x2="-100" y2="1080"/><line x1="960" y1="560" x2="300" y2="1080"/><line x1="960" y1="560" x2="700" y2="1080"/>
      <line x1="960" y1="560" x2="1220" y2="1080"/><line x1="960" y1="560" x2="1620" y2="1080"/><line x1="960" y1="560" x2="2020" y2="1080"/><line x1="960" y1="560" x2="2420" y2="1080"/>
      <line x1="0" y1="850" x2="1920" y2="850"/><line x1="0" y1="920" x2="1920" y2="920"/><line x1="0" y1="1000" x2="1920" y2="1000"/>
    </g>
    <rect y="796" width="1920" height="12" fill="var(--pal-wood_black)"/>
  </g>
  <g class="layer layer-mid">
    <rect x="340" y="0" width="50" height="806" fill="var(--pal-wood_black)" stroke="var(--pal-ink)" stroke-width="6"/>
    <rect x="1640" y="0" width="56" height="806" fill="var(--pal-wood_black)" stroke="var(--pal-ink)" stroke-width="6"/>
    <rect x="0" y="0" width="1920" height="84" fill="var(--pal-wood_black)" stroke="var(--pal-ink)" stroke-width="6"/>
    <g fill="var(--pal-cloth_red_dark)" stroke="var(--pal-ink)" stroke-width="5">
      <rect x="430" y="190" width="70" height="420"/><rect x="830" y="190" width="70" height="420"/>
    </g>
    <g stroke="var(--pal-paper)" stroke-width="3" fill="none" opacity=".7"><rect x="438" y="198" width="54" height="404"/><rect x="838" y="198" width="54" height="404"/></g>
    <ellipse cx="620" cy="868" rx="320" ry="26" fill="var(--pal-shadow)" opacity=".28"/>
  </g>
  <g class="layer layer-near">
    <path d="M0 84 L1920 84 L1920 130 Q960 112 0 130 Z" fill="var(--pal-shadow)" opacity=".55"/>
    <rect y="960" width="1920" height="120" fill="var(--pal-shadow)" opacity=".22"/>
    <rect width="1920" height="1080" fill="url(#har-vig)"/>
  </g>
  <g class="lights" pointer-events="none">
    <rect class="lw lw-warm" width="1920" height="1080" fill="var(--pal-light_warm)"/>
    <rect class="lw lw-dark" width="1920" height="1080" fill="var(--pal-shadow)"/>
    <rect class="lw lw-red" width="1920" height="1080" fill="var(--pal-light_red)"/>
    <rect class="lw lw-dawn" width="1920" height="1080" fill="var(--pal-light_dawn)"/>
  </g>
</g>
</svg>
