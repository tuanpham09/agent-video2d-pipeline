    <path d="M176 78 L240 86 L228 112 L170 104 Z" fill="var(--pal-cloth_grey)" stroke="var(--pal-ink)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M130 66 L178 62 L182 82 L134 86 Z" fill="var(--pal-cloth_white)" stroke="var(--pal-ink)" stroke-width="4" stroke-linejoin="round"/>
