  <ellipse cx="170" cy="100" rx="142" ry="28" fill="var(--pal-bamboo)" stroke="var(--pal-bamboo_shadow)" stroke-width="3"/>
  <g stroke="var(--pal-bamboo_shadow)" stroke-width="2.5" fill="none" opacity=".8">
