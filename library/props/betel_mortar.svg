<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" data-lib-id="betel_mortar" data-lib-kind="prop" role="img" aria-label="Cối đồng giã trầu và chày">
<title>betel_mortar — cối đồng giã trầu + chày</title>
<style>
.prop-betel_mortar .st{display:none}
.prop-betel_mortar[data-state='rest'] .st-rest,.prop-betel_mortar[data-state='raised'] .st-raised,.prop-betel_mortar[data-state='strike'] .st-strike{display:inline}
.prop-betel_mortar .pestle{transform-box:view-box;transform-origin:150px 250px}
</style>
<g class="prop prop-betel_mortar" data-state="rest">
  <ellipse cx="150" cy="332" rx="92" ry="8" fill="var(--pal-shadow)" opacity=".25"/>
  <path d="M64 232 L80 296 Q62 316 56 328 L244 328 Q238 316 220 296 L236 232 Z" fill="var(--pal-brass)" stroke="var(--pal-ink)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M82 252 L94 296 Q80 312 76 322" stroke="var(--pal-flame_core)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"/>
  <path d="M70 262 Q150 280 230 262" stroke="var(--pal-brass_dark)" stroke-width="5" fill="none"/>
  <ellipse cx="150" cy="330" rx="96" ry="8" fill="var(--pal-brass_dark)" stroke="var(--pal-ink)" stroke-width="5"/>
  <ellipse cx="150" cy="232" rx="86" ry="16" fill="var(--pal-brass_dark)" stroke="var(--pal-ink)" stroke-width="6"/>
  <ellipse cx="150" cy="234" rx="66" ry="10" fill="var(--pal-wood_black)"/>
  <ellipse cx="136" cy="236" rx="26" ry="5" fill="var(--pal-leaf)" opacity=".9"/>
  <g class="pestle st st-rest">
    <line x1="150" y1="250" x2="176" y2="96" stroke="var(--pal-ink)" stroke-width="24" stroke-linecap="round"/>
    <line x1="150" y1="250" x2="176" y2="96" stroke="var(--pal-brass)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="177" cy="92" r="14" fill="var(--pal-brass_dark)" stroke="var(--pal-ink)" stroke-width="5"/>
  </g>
  <g class="pestle st st-raised">
    <line x1="150" y1="250" x2="190" y2="60" stroke="var(--pal-ink)" stroke-width="24" stroke-linecap="round" transform="translate(0 -44) rotate(4 150 250)"/>
    <line x1="150" y1="250" x2="190" y2="60" stroke="var(--pal-brass)" stroke-width="14" stroke-linecap="round" transform="translate(0 -44) rotate(4 150 250)"/>
    <circle cx="191" cy="56" r="14" fill="var(--pal-brass_dark)" stroke="var(--pal-ink)" stroke-width="5" transform="translate(0 -44) rotate(4 150 250)"/>
  </g>
  <g class="pestle st st-strike">
    <line x1="150" y1="250" x2="170" y2="104" stroke="var(--pal-ink)" stroke-width="24" stroke-linecap="round"/>
    <line x1="150" y1="250" x2="170" y2="104" stroke="var(--pal-brass)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="171" cy="100" r="14" fill="var(--pal-brass_dark)" stroke="var(--pal-ink)" stroke-width="5"/>
    <g stroke="var(--pal-flame_core)" stroke-width="4" stroke-linecap="round"><line x1="92" y1="226" x2="76" y2="214"/><line x1="208" y1="226" x2="224" y2="214"/><line x1="150" y1="212" x2="150" y2="194"/></g>
  </g>
</g>
</svg>
