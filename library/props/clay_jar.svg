<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" data-lib-id="clay_jar" data-lib-kind="prop" role="img" aria-label="Hũ sành bịt vải đỏ">
<title>clay_jar — hũ sành bịt vải đỏ</title>
<style>
.prop-clay_jar .st{display:none}
.prop-clay_jar[data-state='sealed'] .st-sealed,.prop-clay_jar[data-state='cracked'] .st-sealed,.prop-clay_jar[data-state='cracked'] .st-cracked,
.prop-clay_jar[data-state='open'] .st-open{display:inline}
.prop-clay_jar .cloth{transform-box:view-box;transform-origin:110px 96px}
</style>
<g class="prop prop-clay_jar" data-state="sealed">
  <path d="M56 100 C 14 150 12 232 58 268 L162 268 C 208 232 206 150 164 100 Z" fill="var(--pal-clay)" stroke="var(--pal-ink)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M34 164 Q110 186 186 164" stroke="var(--pal-clay_dark)" stroke-width="5" fill="none"/>
  <path d="M30 206 Q110 228 190 206" stroke="var(--pal-clay_dark)" stroke-width="5" fill="none"/>
  <path d="M44 140 Q30 190 52 238" stroke="var(--pal-clay_light)" stroke-width="7" stroke-linecap="round" fill="none" opacity=".7"/>
  <ellipse cx="110" cy="272" rx="58" ry="8" fill="var(--pal-clay_dark)" stroke="var(--pal-ink)" stroke-width="4"/>
  <ellipse cx="110" cy="98" rx="58" ry="16" fill="var(--pal-clay_dark)" stroke="var(--pal-ink)" stroke-width="6"/>
  <g class="st st-open">
    <ellipse cx="110" cy="100" rx="44" ry="10" fill="var(--pal-shadow)"/>
    <ellipse cx="110" cy="100" rx="30" ry="6" fill="var(--pal-ember)" opacity=".4"/>
    <path class="cloth" d="M60 98 Q22 116 30 184 Q52 164 70 112 Z" fill="var(--pal-cloth_red)" stroke="var(--pal-ink)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M42 130 Q40 156 40 170" stroke="var(--pal-cloth_red_dark)" stroke-width="4" fill="none"/>
  </g>
  <g class="st st-sealed cloth">
    <path d="M46 96 Q110 38 174 96 Q174 112 110 116 Q46 112 46 96 Z" fill="var(--pal-cloth_red)" stroke="var(--pal-ink)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M70 90 Q110 62 150 90" stroke="var(--pal-cloth_red_dark)" stroke-width="4" fill="none"/>
    <path d="M52 104 Q110 118 168 104" stroke="var(--pal-paper)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M100 112 q-8 14 -2 22 M116 112 q8 14 2 22" stroke="var(--pal-paper)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <g class="st st-cracked" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M142 118 L132 150 L148 170 L130 206 L140 244" stroke="var(--pal-ink)" stroke-width="5"/>
    <path d="M132 150 L110 160 M130 206 L108 214" stroke="var(--pal-ink)" stroke-width="3.5"/>
    <path d="M143 120 L134 150" stroke="var(--pal-ember)" stroke-width="2" opacity=".7"/>
  </g>
</g>
</svg>
