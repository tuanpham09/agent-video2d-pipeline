<title>smartphone — điện thoại (cuộc gọi video: không chữ để khỏi phụ thuộc font)</title>
<defs><radialGradient id="phn-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="var(--pal-screen_glow)" stop-opacity=".55"/><stop offset="1" stop-color="var(--pal-screen_glow)" stop-opacity="0"/></radialGradient></defs>
<style>
.prop-smartphone .st{display:none}
.prop-smartphone[data-state='off'] .st-off,.prop-smartphone[data-state='ringing'] .st-ringing,
.prop-smartphone[data-state='call'] .st-call,.prop-smartphone[data-state='ended'] .st-ended,
.prop-smartphone[data-state='ringing'] .st-lit,.prop-smartphone[data-state='call'] .st-lit{display:inline}
</style>
<g class="prop prop-smartphone" data-state="off">
