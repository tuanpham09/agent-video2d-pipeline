<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-label="Đỗ Văn Lâm (Người kể) (host)"><title>Đỗ Văn Lâm (Người kể) (host)</title><style>.rig-host .arm,.rig-host .fore{transform-box:view-box}
.rig-host .arm-l{transform-origin:302px 318px}
.rig-host .arm-r{transform-origin:218px 318px}
.rig-host .fore-l{transform-origin:302px 388px}
.rig-host .fore-r{transform-origin:218px 388px}
.rig-host .eye,.rig-host .sclera,.rig-host .pupil,.rig-host .brow,.rig-host .m-closed{transform-box:fill-box;transform-origin:50% 50%}
.rig-host .lid{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(var(--lid,0))}
.rig-host .eye{transform:scale(calc(var(--es,1) * var(--exs,1)),var(--es,1))}
.rig-host .pupil{transform:translate(var(--gx,0px),var(--gy,0px)) scale(var(--ps,1))}
.rig-host .brow-r{transform:translateY(calc(var(--byr,0) * 1px)) rotate(calc(var(--br,0) * -1deg))}
.rig-host .brow-l{transform:translateY(calc(var(--byl,0) * 1px)) rotate(calc(var(--br,0) * 1deg))}
.rig-host .shade{opacity:var(--shade,0)}
.rig-host .tears{opacity:var(--tear,0)}
.rig-host .m-closed{transform:scaleY(var(--mc,.9))}
.rig-host .mouth *{display:none}
.rig-host[data-khan='off'] .acc-khan{display:none}
.rig-host .lap{display:none}
.rig-host[data-stance='sit'] .lap{display:inline}
.rig-host .leg{transform-box:view-box}
.rig-host .leg-l{transform-origin:284px 470px}
.rig-host .leg-r{transform-origin:236px 470px}
.rig-host[data-stance='sit'] .legs{display:none}
.rig-host[data-stance='sit'] .body{transform:translateY(56px)}
.rig-host .view{transform-box:view-box;transform-origin:260px 0px}
.rig-host .feat,.rig-host .hair-front{transform-box:view-box;transform-origin:260px 215px}
.rig-host[data-view='tq-r'] .view{transform:translateX(5px) scaleX(0.88)}
.rig-host[data-view='tq-r'] .feat{transform:translateX(13px)}
.rig-host[data-view='tq-r'] .hair-front{transform:translateX(6px)}
.rig-host[data-view='tq-r'] .chk-l,.rig-host[data-view='tq-r'] .scar-l{transform:translateX(-19px)}
.rig-host[data-view='tq-r'] .eye-l{--exs:0.72}
.rig-host[data-view='tq-r'] .ear-l{display:none}
.rig-host[data-view='tq-l'] .view{transform:translateX(-5px) scaleX(0.88)}
.rig-host[data-view='tq-l'] .feat{transform:translateX(-13px)}
.rig-host[data-view='tq-l'] .hair-front{transform:translateX(-6px)}
.rig-host[data-view='tq-l'] .chk-r,.rig-host[data-view='tq-l'] .scar-r{transform:translateX(19px)}
.rig-host[data-view='tq-l'] .eye-r{--exs:0.72}
.rig-host[data-view='tq-l'] .ear-r{display:none}
.rig-host[data-emotion='calm']{--byl:0;--byr:0;--br:0;--lid:0.0;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:0.9;--gx:0px}
.rig-host[data-emotion='calm'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='focused']{--byl:2;--byr:2;--br:-7;--lid:0.18;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:0.15;--gx:0px}
.rig-host[data-emotion='focused'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='worried']{--byl:-3;--byr:-3;--br:14;--lid:0.08;--ps:0.95;--es:1.0;--shade:0.0;--tear:0;--mc:-0.9;--gx:0px}
.rig-host[data-emotion='worried'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='afraid']{--byl:-9;--byr:-9;--br:10;--lid:0.0;--ps:0.7;--es:1.12;--shade:0.0;--tear:0;--mc:0.0;--gx:0px}
.rig-host[data-emotion='afraid'][data-mouth='auto'] .m-half{display:inline}
.rig-host[data-emotion='shocked']{--byl:-11;--byr:-11;--br:0;--lid:0.0;--ps:0.5;--es:1.15;--shade:0.0;--tear:0;--mc:0.0;--gx:0px}
.rig-host[data-emotion='shocked'][data-mouth='auto'] .m-round{display:inline}
.rig-host[data-emotion='dread']{--byl:-2;--byr:-2;--br:8;--lid:0.32;--ps:0.7;--es:1.0;--shade:0.28;--tear:0;--mc:-1.1;--gx:0px}
.rig-host[data-emotion='dread'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='sad']{--byl:-2;--byr:-2;--br:16;--lid:0.28;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:-1.0;--gx:0px}
.rig-host[data-emotion='sad'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='grief']{--byl:-3;--byr:-3;--br:20;--lid:0.42;--ps:1.0;--es:1.0;--shade:0.0;--tear:1;--mc:0.0;--gx:0px}
.rig-host[data-emotion='grief'][data-mouth='auto'] .m-half{display:inline}
.rig-host[data-emotion='angry']{--byl:3;--byr:3;--br:-18;--lid:0.2;--ps:0.9;--es:1.0;--shade:0.0;--tear:0;--mc:-1.3;--gx:0px}
.rig-host[data-emotion='angry'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='suspicious']{--byl:-9;--byr:3;--br:-4;--lid:0.34;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:-0.3;--gx:6px}
.rig-host[data-emotion='suspicious'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-emotion='relieved']{--byl:-4;--byr:-4;--br:8;--lid:0.3;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:1.7;--gx:0px}
.rig-host[data-emotion='relieved'][data-mouth='auto'] .m-closed{display:inline}
.rig-host[data-mouth='closed'] .m-closed{display:inline}
.rig-host[data-mouth='half'] .m-half{display:inline}
.rig-host[data-mouth='open'] .m-open{display:inline}
.rig-host[data-mouth='round'] .m-round{display:inline}
.rig-host[data-blink='1'][data-emotion]{--lid:1}
.rig-host[data-gaze='left']{--gx:-5px;--gy:0px}
.rig-host[data-gaze='right']{--gx:5px;--gy:0px}
.rig-host[data-gaze='up']{--gx:0px;--gy:-4px}
.rig-host[data-gaze='down']{--gx:0px;--gy:4px}
.rig-host[data-pose='idle'] .arm-l{transform:rotate(-4deg)}
.rig-host[data-pose='idle'] .fore-l{transform:rotate(0deg)}
.rig-host[data-pose='idle'] .arm-r{transform:rotate(4deg)}
.rig-host[data-pose='idle'] .fore-r{transform:rotate(0deg)}
.rig-host[data-pose='clasp'] .arm-l{transform:rotate(-8deg)}
.rig-host[data-pose='clasp'] .fore-l{transform:rotate(92deg)}
.rig-host[data-pose='clasp'] .arm-r{transform:rotate(8deg)}
.rig-host[data-pose='clasp'] .fore-r{transform:rotate(-92deg)}
.rig-host[data-pose='point-l'] .arm-l{transform:rotate(-72deg)}
.rig-host[data-pose='point-l'] .fore-l{transform:rotate(-8deg)}
.rig-host[data-pose='point-l'] .arm-r{transform:rotate(4deg)}
.rig-host[data-pose='point-l'] .fore-r{transform:rotate(0deg)}
.rig-host[data-pose='reach-l'] .arm-l{transform:rotate(-95deg)}
.rig-host[data-pose='reach-l'] .fore-l{transform:rotate(-4deg)}
.rig-host[data-pose='reach-l'] .arm-r{transform:rotate(4deg)}
.rig-host[data-pose='reach-l'] .fore-r{transform:rotate(0deg)}
.rig-host[data-pose='raise-both'] .arm-l{transform:rotate(-50deg)}
.rig-host[data-pose='raise-both'] .fore-l{transform:rotate(-130deg)}
.rig-host[data-pose='raise-both'] .arm-r{transform:rotate(50deg)}
.rig-host[data-pose='raise-both'] .fore-r{transform:rotate(130deg)}
.rig-host[data-pose='walk-a'] .arm-l{transform:rotate(-4deg)}
.rig-host[data-pose='walk-a'] .fore-l{transform:rotate(0deg)}
.rig-host[data-pose='walk-a'] .arm-r{transform:rotate(4deg)}
.rig-host[data-pose='walk-a'] .fore-r{transform:rotate(0deg)}
.rig-host[data-pose='walk-b'] .arm-l{transform:rotate(-4deg)}
.rig-host[data-pose='walk-b'] .fore-l{transform:rotate(0deg)}
.rig-host[data-pose='walk-b'] .arm-r{transform:rotate(4deg)}
.rig-host[data-pose='walk-b'] .fore-r{transform:rotate(0deg)}
.rig-host[data-pose='walk-a'] .leg-l{transform:translate(6px,-16px)}
.rig-host[data-pose='walk-a'] .leg-r{transform:translate(0px,0px)}
.rig-host[data-pose='walk-b'] .leg-l{transform:translate(0px,0px)}
.rig-host[data-pose='walk-b'] .leg-r{transform:translate(-6px,-16px)}</style><g class="rig rig-host" data-emotion="calm" data-mouth="auto" data-pose="idle" data-stance="stand" data-gaze="center" data-view="front" data-blink="0" data-khan="on"><ellipse class="floor-shadow" cx="260" cy="578" rx="90" ry="9" fill="#000" opacity="0.28"/><g class="scale" transform="translate(260 580) scale(1) translate(-260 -580)"><g class="view"><g class="body"><g class="legs"><g class="leg leg-r"><rect x="224" y="470" width="24" height="98" rx="10" fill="#cfc8b8" stroke="#1f140b" stroke-width="5"/><ellipse cx="236" cy="572" rx="23" ry="11" fill="#120d09" stroke="#1f140b" stroke-width="3"/></g><g class="leg leg-l"><rect x="272" y="470" width="24" height="98" rx="10" fill="#cfc8b8" stroke="#1f140b" stroke-width="5"/><ellipse cx="284" cy="572" rx="23" ry="11" fill="#120d09" stroke="#1f140b" stroke-width="3"/></g></g><ellipse class="lap" cx="260" cy="500" rx="95" ry="30" fill="#cfc8b8" stroke="#1f140b" stroke-width="6"/><rect class="neck" x="248" y="266" width="24" height="44" rx="6" fill="#cf9063" stroke="#1f140b" stroke-width="5"/><rect class="torso" x="210" y="300" width="100" height="195" rx="26" fill="#e6e0d3" stroke="#1f140b" stroke-width="6"/><path class="collar" d="M 240 302 L 260 338 L 280 302 Z" fill="#cf9063" stroke="#1f140b" stroke-width="4" stroke-linejoin="round"/><g class="arm arm-r"><line x1="218" y1="318" x2="218" y2="388" stroke="#1f140b" stroke-width="36" stroke-linecap="round"/><line x1="218" y1="318" x2="218" y2="388" stroke="#cfc8b8" stroke-width="26" stroke-linecap="round"/><g class="fore fore-r"><line x1="218" y1="388" x2="218" y2="450" stroke="#1f140b" stroke-width="34" stroke-linecap="round"/><line x1="218" y1="388" x2="218" y2="450" stroke="#cfc8b8" stroke-width="24" stroke-linecap="round"/><circle class="hand" cx="218" cy="462" r="15" fill="#cf9063" stroke="#1f140b" stroke-width="4"/></g></g><g class="arm arm-l"><line x1="302" y1="318" x2="302" y2="388" stroke="#