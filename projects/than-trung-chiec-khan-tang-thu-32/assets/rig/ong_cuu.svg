<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-label="Ông Cửu (Thầy nhốt trùng) (ong_cuu)"><title>Ông Cửu (Thầy nhốt trùng) (ong_cuu)</title><style>.rig-ong_cuu .arm,.rig-ong_cuu .fore{transform-box:view-box}
.rig-ong_cuu .arm-l{transform-origin:300px 318px}
.rig-ong_cuu .arm-r{transform-origin:220px 318px}
.rig-ong_cuu .fore-l{transform-origin:300px 388px}
.rig-ong_cuu .fore-r{transform-origin:220px 388px}
.rig-ong_cuu .eye,.rig-ong_cuu .sclera,.rig-ong_cuu .pupil,.rig-ong_cuu .brow,.rig-ong_cuu .m-closed{transform-box:fill-box;transform-origin:50% 50%}
.rig-ong_cuu .lid{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(var(--lid,0))}
.rig-ong_cuu .eye{transform:scale(var(--es,1))}
.rig-ong_cuu .pupil{transform:translate(var(--gx,0px),var(--gy,0px)) scale(var(--ps,1))}
.rig-ong_cuu .brow-r{transform:translateY(calc(var(--byr,0) * 1px)) rotate(calc(var(--br,0) * -1deg))}
.rig-ong_cuu .brow-l{transform:translateY(calc(var(--byl,0) * 1px)) rotate(calc(var(--br,0) * 1deg))}
.rig-ong_cuu .shade{opacity:var(--shade,0)}
.rig-ong_cuu .tears{opacity:var(--tear,0)}
.rig-ong_cuu .m-closed{transform:scaleY(var(--mc,.9))}
.rig-ong_cuu .mouth *{display:none}
.rig-ong_cuu[data-khan='off'] .acc-khan{display:none}
.rig-ong_cuu .lap{display:none}
.rig-ong_cuu[data-stance='sit'] .lap{display:inline}
.rig-ong_cuu[data-stance='sit'] .legs{display:none}
.rig-ong_cuu[data-stance='sit'] .body{transform:translateY(56px)}
.rig-ong_cuu[data-emotion='calm']{--byl:0;--byr:0;--br:0;--lid:0.0;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:0.9;--gx:0px}
.rig-ong_cuu[data-emotion='calm'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='focused']{--byl:2;--byr:2;--br:-7;--lid:0.18;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:0.15;--gx:0px}
.rig-ong_cuu[data-emotion='focused'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='worried']{--byl:-3;--byr:-3;--br:14;--lid:0.08;--ps:0.95;--es:1.0;--shade:0.0;--tear:0;--mc:-0.9;--gx:0px}
.rig-ong_cuu[data-emotion='worried'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='afraid']{--byl:-9;--byr:-9;--br:10;--lid:0.0;--ps:0.7;--es:1.12;--shade:0.0;--tear:0;--mc:0.0;--gx:0px}
.rig-ong_cuu[data-emotion='afraid'][data-mouth='auto'] .m-half{display:inline}
.rig-ong_cuu[data-emotion='shocked']{--byl:-11;--byr:-11;--br:0;--lid:0.0;--ps:0.5;--es:1.15;--shade:0.0;--tear:0;--mc:0.0;--gx:0px}
.rig-ong_cuu[data-emotion='shocked'][data-mouth='auto'] .m-round{display:inline}
.rig-ong_cuu[data-emotion='dread']{--byl:-2;--byr:-2;--br:8;--lid:0.32;--ps:0.7;--es:1.0;--shade:0.28;--tear:0;--mc:-1.1;--gx:0px}
.rig-ong_cuu[data-emotion='dread'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='sad']{--byl:-2;--byr:-2;--br:16;--lid:0.28;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:-1.0;--gx:0px}
.rig-ong_cuu[data-emotion='sad'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='grief']{--byl:-3;--byr:-3;--br:20;--lid:0.42;--ps:1.0;--es:1.0;--shade:0.0;--tear:1;--mc:0.0;--gx:0px}
.rig-ong_cuu[data-emotion='grief'][data-mouth='auto'] .m-half{display:inline}
.rig-ong_cuu[data-emotion='angry']{--byl:3;--byr:3;--br:-18;--lid:0.2;--ps:0.9;--es:1.0;--shade:0.0;--tear:0;--mc:-1.3;--gx:0px}
.rig-ong_cuu[data-emotion='angry'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='suspicious']{--byl:-9;--byr:3;--br:-4;--lid:0.34;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:-0.3;--gx:6px}
.rig-ong_cuu[data-emotion='suspicious'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-emotion='relieved']{--byl:-4;--byr:-4;--br:8;--lid:0.3;--ps:1.0;--es:1.0;--shade:0.0;--tear:0;--mc:1.7;--gx:0px}
.rig-ong_cuu[data-emotion='relieved'][data-mouth='auto'] .m-closed{display:inline}
.rig-ong_cuu[data-mouth='closed'] .m-closed{display:inline}
.rig-ong_cuu[data-mouth='half'] .m-half{display:inline}
.rig-ong_cuu[data-mouth='open'] .m-open{display:inline}
.rig-ong_cuu[data-mouth='round'] .m-round{display:inline}
.rig-ong_cuu[data-blink='1'][data-emotion]{--lid:1}
.rig-ong_cuu[data-gaze='left']{--gx:-5px;--gy:0px}
.rig-ong_cuu[data-gaze='right']{--gx:5px;--gy:0px}
.rig-ong_cuu[data-gaze='up']{--gx:0px;--gy:-4px}
.rig-ong_cuu[data-gaze='down']{--gx:0px;--gy:4px}
.rig-ong_cuu[data-pose='idle'] .arm-l{transform:rotate(-4deg)}
.rig-ong_cuu[data-pose='idle'] .fore-l{transform:rotate(0deg)}
.rig-ong_cuu[data-pose='idle'] .arm-r{transform:rotate(4deg)}
.rig-ong_cuu[data-pose='idle'] .fore-r{transform:rotate(0deg)}
.rig-ong_cuu[data-pose='clasp'] .arm-l{transform:rotate(-8deg)}
.rig-ong_cuu[data-pose='clasp'] .fore-l{transform:rotate(92deg)}
.rig-ong_cuu[data-pose='clasp'] .arm-r{transform:rotate(8deg)}
.rig-ong_cuu[data-pose='clasp'] .fore-r{transform:rotate(-92deg)}
.rig-ong_cuu[data-pose='point-l'] .arm-l{transform:rotate(-72deg)}
.rig-ong_cuu[data-pose='point-l'] .fore-l{transform:rotate(-8deg)}
.rig-ong_cuu[data-pose='point-l'] .arm-r{transform:rotate(4deg)}
.rig-ong_cuu[data-pose='point-l'] .fore-r{transform:rotate(0deg)}
.rig-ong_cuu[data-pose='reach-l'] .arm-l{transform:rotate(-95deg)}
.rig-ong_cuu[data-pose='reach-l'] .fore-l{transform:rotate(-4deg)}
.rig-ong_cuu[data-pose='reach-l'] .arm-r{transform:rotate(4deg)}
.rig-ong_cuu[data-pose='reach-l'] .fore-r{transform:rotate(0deg)}
.rig-ong_cuu[data-pose='raise-both'] .arm-l{transform:rotate(-50deg)}
.rig-ong_cuu[data-pose='raise-both'] .fore-l{transform:rotate(-130deg)}
.rig-ong_cuu[data-pose='raise-both'] .arm-r{transform:rotate(50deg)}
