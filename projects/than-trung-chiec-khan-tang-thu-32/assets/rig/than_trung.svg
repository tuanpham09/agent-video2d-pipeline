<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-label="Thần Trùng (than_trung)"><title>Thần Trùng (than_trung)</title><style>.rig-than_trung .arm,.rig-than_trung .fore{transform-box:view-box}
